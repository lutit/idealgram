name: Release Build (Multi-Arch)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]

    env:
      NATIVE_TARGET: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"

      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties

      - name: Enable Optimization
        run: |
          sed -i 's/^-dontoptimize$/#-dontoptimize/' TMessagesProj/proguard-rules.pro
          echo "ProGuard optimization enabled for CI build"
          grep -n "dontoptimize" TMessagesProj/proguard-rules.pro || echo "No dontoptimize rules found"

      - name: Release Build (${{ matrix.arch }})
        id: release_build_step
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Building for architecture: $NATIVE_TARGET"
          ./gradlew TMessagesProj:assembleRelease -PNATIVE_TARGET=$NATIVE_TARGET
          APK_DIR=$(find TMessagesProj/build/outputs/apk -type d -name "release" | head -n 1)
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"

      - name: Upload APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.arch }}
          path: ${{ env.APK_DIR }}
  merge:
    name: Merge All APKs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: List downloaded artifacts
        run: ls -R release_artifacts

      - name: Create combined archive
        run: |
          mkdir merged
          cp -r release_artifacts/* merged/
          cd merged
          zip -r ../Uzbekgram_Release_All_ABIs.zip .
          cd ..

      - name: Upload merged archive
        uses: actions/upload-artifact@v4
        with:
          name: Uzbekgram_Release_All_ABIs
          path: Uzbekgram_Release_All_ABIs.zip
